apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  replicas: 2
  selector:
    matchLabels:
      app: shortener
  template:
    metadata:
      labels:
        app: shortener
    spec:
      serviceAccountName: shortener-sa
      containers:
      - name: shortener
        image: pistionhead/shortener:latest
        env:
          - name: BASE_URL
            value: "http://k8s-default-urlshort-75cb30e9e9-2131200395.us-east-1.elb.amazonaws.com"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
